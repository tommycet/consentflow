[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
evm_version = "prague"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 32

[profile.monad]
src = "contracts"
out = "out"
libs = ["lib"]
evm_version = "prague"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]
