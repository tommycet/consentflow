[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
evm_version = "prague"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

[profile.monad]
src = "contracts"
out = "out"
libs = ["lib"]
evm_version = "prague"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Monad testnet — chain ID 10143
# Deploy: forge script script/Deploy.s.sol --rpc-url $MONAD_RPC --private-key $DEPLOYER_PRIVATE_KEY --broadcast --verify
# Verify: forge script script/VerifyDeployment.s.sol --rpc-url $MONAD_RPC
